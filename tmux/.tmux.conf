# -----------------------------------------------------------------------------
# Tmux Configuration - Optimized for efficient workflow
# -----------------------------------------------------------------------------

# Change prefix from Ctrl+b to Ctrl+a (more ergonomic)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Reload config file with prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# -----------------------------------------------------------------------------
# General Settings
# -----------------------------------------------------------------------------

# Enable mouse support (scroll, select panes, resize)
set -g mouse on

# Start window numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 50000

# Display tmux messages for 4 seconds
set -g display-time 4000

# Refresh status bar every 5 seconds
set -g status-interval 5

# Enable focus events for better terminal integration
set -g focus-events on

# Enable true color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Reduce escape time for faster key response
set -sg escape-time 10

# Enable aggressive resize for better multi-monitor support
setw -g aggressive-resize on

# -----------------------------------------------------------------------------
# Window and Pane Management
# -----------------------------------------------------------------------------

# Split panes with more intuitive keybindings
bind | split-window -h -c "#{pane_current_path}"  # Horizontal split with |
bind - split-window -v -c "#{pane_current_path}"  # Vertical split with -
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Navigate between panes with vim-style keys (without prefix)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Navigate between windows with Shift+Arrow
bind -n S-Left previous-window
bind -n S-Right next-window

# Resize panes with prefix + arrow keys
bind -r Left resize-pane -L 5
bind -r Down resize-pane -D 5
bind -r Up resize-pane -U 5
bind -r Right resize-pane -R 5

# Resize panes with prefix + hjkl (vim-style)
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# Toggle pane zoom with prefix + z (default, but explicit)
bind z resize-pane -Z

# Swap windows with prefix + < or >
bind -r < swap-window -t -1\; select-window -t -1
bind -r > swap-window -t +1\; select-window -t +1

# -----------------------------------------------------------------------------
# Copy Mode (Vi-style)
# -----------------------------------------------------------------------------

# Use vi mode for copy mode
setw -g mode-keys vi

# Enter copy mode with prefix + [
bind [ copy-mode

# Vi-style selection in copy mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# Paste with prefix + ]
bind ] paste-buffer

# Browse copy mode with prefix + PgUp
bind -n C-PPage copy-mode -u

# -----------------------------------------------------------------------------
# Status Bar Theme (Gruvbox-inspired)
# -----------------------------------------------------------------------------

# Status bar position
set-option -g status-position bottom

# Status bar colors
set -g status-style 'bg=#282828 fg=#ebdbb2'

# Left side: session name
set -g status-left-length 40
set -g status-left '#[bg=#458588,fg=#282828,bold] #S #[bg=#282828] '

# Right side: hostname, date, time
set -g status-right-length 100
set -g status-right '#[fg=#ebdbb2]#H #[fg=#504945]| #[fg=#ebdbb2]%Y-%m-%d #[fg=#504945]| #[fg=#ebdbb2,bold]%H:%M '

# Window status format
setw -g window-status-format '#[fg=#a89984] #I:#W#F '
setw -g window-status-current-format '#[bg=#458588,fg=#282828,bold] #I:#W#F #[bg=#282828] '

# Window status separator
setw -g window-status-separator ''

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off
setw -g window-status-activity-style 'fg=#fb4934,bold'

# Pane border colors
set -g pane-border-style 'fg=#504945'
set -g pane-active-border-style 'fg=#458588'

# Message colors
set -g message-style 'bg=#458588 fg=#282828 bold'

# Clock mode color
setw -g clock-mode-colour '#458588'

# -----------------------------------------------------------------------------
# Additional Keybindings
# -----------------------------------------------------------------------------

# Clear screen and scrollback with prefix + Ctrl+l
bind C-l send-keys 'C-l' \; clear-history

# Kill pane without confirmation
bind x kill-pane

# Kill window without confirmation
bind X kill-window

# Break pane into new window
bind b break-pane -d

# Join pane from another window
bind-key j command-prompt -p "join pane from:" "join-pane -s '%%'"

# Choose session with prefix + s (default, but explicit)
bind s choose-tree -Zs

